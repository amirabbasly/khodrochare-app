<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112a38" />
    <title>بدون اتصال | خودرو چاره</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #173140; background: #f4f7f8; font-family: Tahoma, sans-serif; text-align: center; }
      main { width: min(440px, 100%); padding: 36px 28px; border: 1px solid #e4eaed; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px rgba(22, 48, 64, .09); }
      img { width: 80px; height: 80px; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #788b95; font-size: 13px; line-height: 2; }
      button { min-height: 44px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 12px; color: #fff; background: #f47725; font: inherit; font-size: 13px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="نشان خودرو چاره" />
      <h1>ارتباط اینترنتی در دسترس نیست</h1>
      <p>وقتی دوباره آنلاین شدی، خودرو چاره آمادهٔ همراهی توست.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
